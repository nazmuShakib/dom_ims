name: Build DOM Cloud ARM64 bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: domcloud-arm64-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish ARM64 release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
        run: npm ci --no-audit --no-fund

      - name: Run tests and type checking
        env:
          DATA_SOURCE: json
        run: |
          npm test
          npm run typecheck

      - name: Build the production app
        env:
          DATA_SOURCE: postgres
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
          DATABASE_URL_UNPOOLED: postgresql://build:build@127.0.0.1:5432/build?schema=public
          BETTER_AUTH_SECRET: github-actions-build-only-secret-not-used-in-production
          BETTER_AUTH_URL: https://example.invalid
        run: npm run build

      - name: Assemble the DOM Cloud bundle
        run: |
          mkdir -p bundle/.dom-app bundle/.dom-tools
          cp -a .next/standalone/. bundle/.dom-app/
          mkdir -p bundle/.dom-app/.next
          cp -a .next/static bundle/.dom-app/.next/static
          cp -a public bundle/.dom-app/public
          prisma_version="$(node -p "require('./node_modules/prisma/package.json').version")"
          tsx_version="$(node -p "require('./node_modules/tsx/package.json').version")"
          npm install --prefix bundle/.dom-tools --omit=dev --no-audit --no-fund --package-lock=false "prisma@$prisma_version" "tsx@$tsx_version"
          printf '%s\n' "$GITHUB_SHA" > bundle/BUILD_SHA
          tar -C bundle -czf domcloud-arm64.tar.gz .dom-app .dom-tools BUILD_SHA
          du -sh bundle domcloud-arm64.tar.gz

      - name: Replace the rolling DOM Cloud release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete domcloud-latest --cleanup-tag --yes || true
          gh release create domcloud-latest domcloud-arm64.tar.gz \
            --target "$GITHUB_SHA" \
            --title "DOM Cloud ARM64 build" \
            --notes "ARM64 production bundle for commit $GITHUB_SHA"

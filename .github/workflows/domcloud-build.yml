name: Build DOM Cloud ARM64 bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: domcloud-arm64-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish ARM64 release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
        run: npm ci --no-audit --no-fund

      - name: Run tests and type checking
        env:
          DATA_SOURCE: json
        run: |
          npm test
          npm run typecheck

      - name: Build the production app
        env:
          DATA_SOURCE: postgres
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
          DATABASE_URL_UNPOOLED: postgresql://build:build@127.0.0.1:5432/build?schema=public
          BETTER_AUTH_SECRET: github-actions-build-only-secret-not-used-in-production
          BETTER_AUTH_URL: https://example.invalid
        run: npm run build

      - name: Assemble the DOM Cloud bundle
        run: |
          mkdir -p bundle/.dom-app tooling
          cp -a .next/standalone/. bundle/.dom-app/
          mkdir -p bundle/.dom-app/.next
          cp -a .next/static bundle/.dom-app/.next/static
          cp -a public bundle/.dom-app/public
          prisma_version="$(node -p "require('./node_modules/prisma/package.json').version")"
          prisma_client_version="$(node -p "require('./node_modules/@prisma/client/package.json').version")"
          tsx_version="$(node -p "require('./node_modules/tsx/package.json').version")"
          better_auth_version="$(node -p "require('./node_modules/better-auth/package.json').version")"
          npm install --prefix tooling --omit=dev --no-audit --no-fund --package-lock=false \
            "prisma@$prisma_version" \
            "@prisma/client@$prisma_client_version" \
            "tsx@$tsx_version" \
            "better-auth@$better_auth_version"
          cp -a tooling/node_modules/. bundle/.dom-app/node_modules/
          rm -rf bundle/.dom-app/node_modules/.prisma
          cp -a node_modules/.prisma bundle/.dom-app/node_modules/.prisma
          (
            cd bundle/.dom-app
            node --input-type=module -e 'const { PrismaClient } = await import("@prisma/client"); const prisma = new PrismaClient(); await prisma.$disconnect(); await import("better-auth");'
          )
          printf '%s\n' "$GITHUB_SHA" > bundle/BUILD_SHA
          tar -C bundle -czf domcloud-arm64.tar.gz .dom-app BUILD_SHA
          du -sh bundle domcloud-arm64.tar.gz

      - name: Replace the rolling DOM Cloud release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete domcloud-latest --cleanup-tag --yes || true
          gh release create domcloud-latest domcloud-arm64.tar.gz \
            --target "$GITHUB_SHA" \
            --title "DOM Cloud ARM64 build" \
            --notes "ARM64 production bundle for commit $GITHUB_SHA"

      - name: Deploy the released bundle to DOM Cloud
        uses: distributhor/workflow-webhook@v3
        env:
          webhook_url: https://my.domcloud.co/api/githubdeploy
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          webhook_auth: ${{ secrets.WEBHOOK_AUTH }}
          data: |
            {
              "features": ["node 24", "postgresql"],
              "nginx": {
                "root": "public_html/.dom-app/public",
                "passenger": {
                  "enabled": "on",
                  "app_env": "production",
                  "app_start_command": "env PORT=$PORT HOSTNAME=127.0.0.1 node --env-file=.env.local server.js"
                },
                "locations": [
                  {
                    "match": "/_next/static/",
                    "alias": "public_html/.dom-app/.next/static/"
                  }
                ]
              },
              "commands": [
                "git pull --ff-only",
                "test -f \"$HOME/.config/dom_ims.env\"",
                "ln -sfn \"$HOME/.config/dom_ims.env\" .env.local",
                "curl --fail --location --retry 3 --retry-all-errors --output \"/tmp/domcloud-arm64-${USER}.tar.gz\" \"https://github.com/nazmuShakib/dom_ims/releases/download/domcloud-latest/domcloud-arm64.tar.gz\"",
                "test \"$(git rev-parse HEAD)\" = \"$(tar -xOf \"/tmp/domcloud-arm64-${USER}.tar.gz\" BUILD_SHA)\"",
                "rm -rf .dom-app .dom-tools node_modules",
                "tar -xzf \"/tmp/domcloud-arm64-${USER}.tar.gz\"",
                "rm -f \"/tmp/domcloud-arm64-${USER}.tar.gz\"",
                "ln -sfn \"$HOME/.config/dom_ims.env\" .dom-app/.env.local",
                "ln -s .dom-app/node_modules node_modules",
                "node --env-file=.env.local .dom-app/node_modules/prisma/build/index.js migrate deploy",
                "restart"
              ],
              "wait": 90
            }

      - name: Check DOM Cloud deployment status
        uses: distributhor/workflow-webhook@v3
        env:
          webhook_url: https://my.domcloud.co/api/githubdeploycheck
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          webhook_auth: ${{ secrets.WEBHOOK_AUTH }}

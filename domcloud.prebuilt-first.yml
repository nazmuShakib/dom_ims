# Run once after domcloud.initial.yml and after creating ~/.config/dom_ims.env.
# The GitHub Actions workflow must have published the domcloud-latest release.
features:
  - node 24
  - postgresql

nginx:
  root: public_html/.dom-app/public
  passenger:
    enabled: on
    app_env: production
    app_start_command: env PORT=$PORT node --env-file=.env.local server.js
  locations:
    - match: /_next/static/
      alias: public_html/.dom-app/.next/static/

commands:
  - git pull --ff-only
  - test -f "$HOME/.config/dom_ims.env"
  - ln -sfn "$HOME/.config/dom_ims.env" .env.local
  - curl --fail --location --retry 3 --retry-all-errors --output "/tmp/domcloud-arm64-${USER}.tar.gz" "https://github.com/nazmuShakib/dom_ims/releases/download/domcloud-latest/domcloud-arm64.tar.gz"
  - test "$(git rev-parse HEAD)" = "$(tar -xOf "/tmp/domcloud-arm64-${USER}.tar.gz" BUILD_SHA)"
  - rm -rf .dom-app .dom-tools node_modules
  - tar -xzf "/tmp/domcloud-arm64-${USER}.tar.gz"
  - rm -f "/tmp/domcloud-arm64-${USER}.tar.gz"
  - ln -sfn "$HOME/.config/dom_ims.env" .dom-app/.env.local
  - ln -s .dom-app/node_modules node_modules
  - node --env-file=.env.local .dom-app/node_modules/prisma/build/index.js migrate deploy
  - node --env-file=.env.local --import ./.dom-app/node_modules/tsx/dist/loader.mjs scripts/bootstrap-admin.ts
  - restart
